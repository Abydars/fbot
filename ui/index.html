<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXNESS FOREX BOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* ─── Reset & Base ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0f;--bg1:#111116;--bg2:#16161d;--bg3:#1c1c25;
  --border:#1f1f2e;--border2:#2a2a3a;
  --text:#d1d4dc;--text2:#787b86;--text3:#4a4a5a;
  --green:#26a69a;--green2:#1a7a70;
  --red:#ef5350;--red2:#b03230;
  --orange:#f7931a;--blue:#2979ff;
  --font:'JetBrains Mono',monospace;
  --top-h:42px;--bot-h:36px;--left-w:186px;--right-w:272px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:11px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ─── Layout ─────────────────────────────────────────────────── */
#app{
  display:grid;
  grid-template-rows:var(--top-h) 1fr var(--bot-h);
  grid-template-columns:var(--left-w) 1fr var(--right-w);
  grid-template-areas:"topbar topbar topbar" "scanner center positions" "botbar botbar botbar";
  height:100vh;width:100vw;
}

/* ─── Top Bar ────────────────────────────────────────────────── */
#topbar{
  grid-area:topbar;display:flex;align-items:center;gap:16px;
  padding:0 14px;background:var(--bg1);border-bottom:1px solid var(--border);z-index:10;
}
.logo{font-size:13px;font-weight:700;color:#fff;letter-spacing:1px;white-space:nowrap}
.mode-badge{padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:1px}
.mode-badge.demo{background:#1a3a1a;color:var(--green);border:1px solid var(--green2)}
.mode-badge.live{background:#3a1a1a;color:var(--red);border:1px solid var(--red2);animation:pulse-border 1.5s infinite}
@keyframes pulse-border{0%,100%{border-color:var(--red2)}50%{border-color:var(--red)}}
.top-stats{display:flex;gap:20px;margin-left:8px}
.top-stat{display:flex;flex-direction:column}
.top-stat .lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.top-stat .val{font-size:12px;font-weight:600;color:var(--text)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ws-dot{width:7px;height:7px;border-radius:50%;background:var(--red);transition:background .3s;flex-shrink:0}
.ws-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
#clock{color:var(--text2);font-size:11px;white-space:nowrap}
.btn-top{padding:3px 10px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.5px;transition:all .15s}
.btn-top:hover{border-color:var(--orange);color:var(--orange)}
.btn-top.paused{border-color:var(--red);color:var(--red)}

/* ─── Left Scanner ───────────────────────────────────────────── */
#scanner{grid-area:scanner;display:flex;flex-direction:column;background:var(--bg1);border-right:1px solid var(--border);overflow:hidden}
.panel-hdr{padding:8px 10px 6px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:6px;flex-shrink:0}
.panel-hdr .cnt{color:var(--text3);font-weight:400}
#scanner-list{overflow-y:auto;flex:1}
.scan-row{display:flex;align-items:center;padding:5px 8px;cursor:pointer;border-bottom:1px solid transparent;transition:background .1s;gap:5px;border-left:2px solid transparent}
.scan-row:hover{background:var(--bg2)}
.scan-row.active{background:var(--bg3);border-left-color:var(--blue)}
.scan-sym{flex:1;min-width:0;font-size:10px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan-sym em{color:var(--text3);font-style:normal;font-weight:400}
.scan-bar-wrap{width:34px;height:3px;background:var(--bg3);border-radius:2px;flex-shrink:0}
.scan-bar{height:3px;border-radius:2px;transition:width .5s}
.scan-bar.pb{background:var(--green)}
.scan-bar.bo{background:var(--orange)}
.scan-arr{font-size:9px;flex-shrink:0;width:8px;text-align:center}
.scan-arr.up{color:var(--green)}.scan-arr.down{color:var(--red)}.scan-arr.flat{color:var(--text3)}

/* ─── Center ─────────────────────────────────────────────────── */
#center{grid-area:center;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.chart-topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:40px;flex-shrink:0;background:var(--bg1);border-bottom:1px solid var(--border)}
.chart-sym{font-size:14px;font-weight:700;color:#fff}
.chart-price{font-size:13px;font-weight:600;color:var(--text)}
.tf-btns{display:flex;gap:2px}
.tf-btn{padding:2px 7px;border-radius:2px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font);font-size:10px;transition:all .12s}
.tf-btn:hover{color:var(--text);border-color:var(--text3)}
.tf-btn.active{background:var(--bg3);color:#fff;border-color:var(--border2)}
.dir-btns{display:flex;gap:4px;margin-left:auto}
.dir-btn{padding:3px 10px;border-radius:3px;font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.5px;cursor:pointer;border:none;transition:opacity .15s}
.dir-btn.long{background:var(--green);color:#000}
.dir-btn.short{background:var(--red);color:#fff}
.dir-btn:hover{opacity:.85}
.center-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.tab-btn{padding:7px 16px;background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.5px;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
.tab-btn.active{color:#fff;border-bottom-color:var(--blue)}
.tab-btn:hover:not(.active){color:var(--text)}
#chart-container{flex:1;overflow:hidden;position:relative}
#lwchart{width:100%;height:100%}
#history-panel{flex:1;overflow-y:auto;display:none}
.hist-table{width:100%;border-collapse:collapse}
.hist-table th{padding:6px 8px;text-align:left;font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg1);white-space:nowrap}
.hist-table td{padding:0;border-bottom:1px solid var(--border)}
.hist-row.win .hist-cell-main{border-left:2px solid var(--green)}
.hist-row.loss .hist-cell-main{border-left:2px solid var(--red)}
.hist-row:hover .hist-cell-main,.hist-row:hover .hist-cell-sub{background:var(--bg2)}
.hist-cell-main{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:10px}
.hist-cell-sub{display:flex;gap:16px;padding:3px 8px 5px 10px;font-size:9px;color:var(--text3);border-top:1px dashed rgba(255,255,255,.05)}
.hist-sym{font-weight:700;color:#fff;min-width:52px}
.hist-dir{font-size:8px;font-weight:700;padding:1px 4px;border-radius:2px}
.hist-dir.long{background:#0d2e2a;color:var(--green);border:1px solid var(--green2)}
.hist-dir.short{background:#2e0d0d;color:var(--red);border:1px solid var(--red2)}
.hist-strat{font-size:8px;color:var(--text3);border:1px solid var(--border);border-radius:2px;padding:1px 4px}
.hist-reason{font-size:8px;font-weight:700;padding:1px 5px;border-radius:2px;margin-left:auto}
.hist-reason.tp{background:#0d2e2a;color:var(--green)}
.hist-reason.sl{background:#2e0d0d;color:var(--red)}
.hist-reason.manual{background:#1a1a2e;color:#7878b0;border:1px solid #3a3a60}
.hist-reason.other{background:#1a1a1a;color:var(--text3)}
.hist-pnl{font-weight:700;font-size:10px}
.hist-pips{font-size:9px;color:var(--text3)}

/* ─── Right Positions ────────────────────────────────────────── */
#positions{grid-area:positions;display:flex;flex-direction:column;background:var(--bg1);border-left:1px solid var(--border);overflow:hidden}
.pos-hdr{padding:8px 10px 6px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;flex-shrink:0}
.btn-close-all{margin-left:auto;padding:2px 8px;border-radius:3px;background:var(--red2);border:1px solid var(--red);color:#fff;font-family:var(--font);font-size:9px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:background .12s}
.btn-close-all:hover{background:var(--red)}
#positions-list{overflow-y:auto;flex:1}
.no-pos{display:flex;align-items:center;justify-content:center;height:100px;color:var(--text3);font-size:10px}
.pos-card{border-bottom:1px solid var(--border);padding:8px 10px 6px;transition:background .1s}
.pos-card:hover{background:var(--bg2)}
.pos-card-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pos-sym{font-size:11px;font-weight:700;color:#fff;cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.3)}.pos-sym:hover{color:var(--accent)}
.pos-sym em{color:var(--text3);font-style:normal;font-weight:400;font-size:10px}
.dir-badge{padding:1px 5px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:.3px}
.dir-badge.long{background:#0d2e2a;color:var(--green);border:1px solid var(--green2)}
.dir-badge.short{background:#2e0d0d;color:var(--red);border:1px solid var(--red2)}
.strat-badge{padding:1px 5px;border-radius:2px;font-size:9px;font-weight:700;background:#1a1a2e;color:var(--blue);border:1px solid #2040a0}
.pos-pnl{margin-left:auto;text-align:right}
.pnl-val{font-size:12px;font-weight:700;transition:color .3s,opacity .2s}
.roe-val{font-size:9px;color:var(--text2)}
.pnl-val.pos,.roe-val.pos{color:var(--green)}
.pnl-val.neg,.roe-val.neg{color:var(--red)}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-bottom:5px}
.pos-fld .lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px}
.pos-fld .val{font-size:10px;color:var(--text);font-weight:500}
.pos-fld .val.r{color:var(--red)}.pos-fld .val.g{color:var(--green)}
.pos-fld .chg{font-size:9px}
.pos-fld .chg.p{color:var(--green)}.pos-fld .chg.n{color:var(--red)}
.btn-close{width:100%;padding:4px 0;margin-top:4px;border-radius:3px;background:var(--red2);border:1px solid var(--red);color:#fff;font-family:var(--font);font-size:10px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:background .12s}
.btn-close:hover{background:var(--red)}

/* ─── Bottom Bar ─────────────────────────────────────────────── */
#botbar{grid-area:botbar;display:flex;align-items:center;background:var(--bg2);border-top:1px solid var(--border);padding:0 12px;overflow:hidden}
.bot-stat{display:flex;align-items:center;gap:5px;padding:0 10px;border-right:1px solid var(--border);white-space:nowrap}
.bot-stat:first-child{padding-left:0}
.bot-stat .lbl{font-size:9px;color:var(--text3);text-transform:uppercase}
.bot-stat .val{font-size:11px;font-weight:600;color:var(--text)}
.bot-stat .val.p{color:var(--green)}.bot-stat .val.n{color:var(--red)}
.ticker{flex:1;overflow:hidden;padding-left:12px;color:var(--text2);font-size:9px;white-space:nowrap;text-overflow:ellipsis}
.ticker b{color:var(--orange)}
.val.p{color:var(--green)}.val.n{color:var(--red)}

/* ─── Config Modal ───────────────────────────────────────────── */
.cfg-tab{padding:8px 16px;background:transparent;border:none;color:var(--text2);font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.5px;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
.cfg-tab.active{color:#fff;border-bottom-color:var(--blue)}
.cfg-tab:hover:not(.active){color:var(--text)}
.cfg-section{display:none}.cfg-section.active{display:block}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.cfg-field{display:flex;flex-direction:column;gap:4px}
.cfg-field.full{grid-column:1/-1}
.cfg-field label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.cfg-input{padding:6px 9px;background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-family:var(--font);font-size:11px;outline:none;transition:border .12s;width:100%}
.cfg-input:focus{border-color:var(--blue)}
.cfg-input[type=number]{-moz-appearance:textfield}
.cfg-input::-webkit-outer-spin-button,.cfg-input::-webkit-inner-spin-button{-webkit-appearance:none}
.cfg-select{padding:6px 9px;background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-family:var(--font);font-size:11px;outline:none;width:100%;cursor:pointer}
.cfg-select:focus{border-color:var(--blue)}
.cfg-select option{background:var(--bg3)}
.cfg-toggle{display:flex;align-items:center;gap:8px;padding:6px 0}
.cfg-toggle input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--blue)}
.cfg-textarea{padding:6px 9px;background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-family:var(--font);font-size:11px;outline:none;width:100%;resize:vertical;min-height:80px;line-height:1.6}
.cfg-textarea:focus{border-color:var(--blue)}
.cfg-hint{font-size:9px;color:var(--text3)}
</style>
</head>
<body>
<div id="app">

<!-- ══ TOP BAR ═════════════════════════════════════════════════ -->
<div id="topbar">
  <span class="logo">▲ EXNESS BOT</span>
  <span id="mode-badge" class="mode-badge demo">● DEMO</span>
  <div class="top-stats">
    <div class="top-stat"><span class="lbl">Balance</span><span class="val" id="t-bal">—</span></div>
    <div class="top-stat"><span class="lbl">Equity</span><span class="val" id="t-eq">—</span></div>
    <div class="top-stat"><span class="lbl">Free Margin</span><span class="val" id="t-fm">—</span></div>
    <div class="top-stat"><span class="lbl">Day P&amp;L</span><span class="val" id="t-pnl">—</span></div>
    <div class="top-stat"><span class="lbl">Positions</span><span class="val" id="t-pos">0</span></div>
    <div class="top-stat"><span class="lbl">Watchlist</span><span class="val" id="t-wl">0</span></div>
  </div>
  <div class="top-right">
    <div class="ws-dot" id="ws-dot"></div>
    <span id="clock">--:--:--</span>
    <button class="btn-top" id="btn-pause" onclick="togglePause()">⏸ PAUSE</button>
    <button class="btn-top" onclick="openConfig()">⚙ CONFIG</button>
  </div>
</div>

<!-- ══ LEFT: SCANNER ═══════════════════════════════════════════ -->
<div id="scanner">
  <div class="panel-hdr">SCANNER <span class="cnt" id="scan-cnt">(0)</span></div>
  <div id="scanner-list"></div>
</div>

<!-- ══ CENTER ══════════════════════════════════════════════════ -->
<div id="center">
  <div class="chart-topbar">
    <span class="chart-sym" id="chart-sym">SELECT SYMBOL</span>
    <span class="chart-price" id="chart-price"></span>
    <div class="tf-btns" id="tf-btns">
      <button class="tf-btn" onclick="setTF('M1')">1m</button>
      <button class="tf-btn" onclick="setTF('M5')">5m</button>
      <button class="tf-btn active" onclick="setTF('M15')">15m</button>
      <button class="tf-btn" onclick="setTF('H1')">1h</button>
      <button class="tf-btn" onclick="setTF('H4')">4h</button>
    </div>
    <div class="dir-btns">
      <button class="dir-btn long"  onclick="manualSignal('LONG')">▲ LONG</button>
      <button class="dir-btn short" onclick="manualSignal('SHORT')">▼ SHORT</button>
    </div>
  </div>
  <div class="center-tabs">
    <button class="tab-btn active" id="tab-chart"   onclick="showTab('chart')">CHART</button>
    <button class="tab-btn"        id="tab-hist"    onclick="showTab('history')">TRADE HISTORY <span id="hist-cnt">(0)</span></button>
  </div>
  <div id="chart-container"><div id="lwchart"></div></div>
  <div id="history-panel">
    <table class="hist-table">
      <thead><tr><th>Trade</th><th>P&amp;L</th></tr></thead>
      <tbody id="hist-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ══ RIGHT: POSITIONS ════════════════════════════════════════ -->
<div id="positions">
  <div class="pos-hdr">
    OPEN POSITIONS <span id="pos-cnt" style="color:var(--text3);font-weight:400;margin-left:4px">(0)</span>
    <button class="btn-close-all" onclick="closeAll()">✕ CLOSE ALL</button>
  </div>
  <div id="positions-list">
    <div class="no-pos" id="no-pos">NO OPEN POSITIONS</div>
  </div>
</div>

<!-- ══ BOTTOM BAR ══════════════════════════════════════════════ -->
<div id="botbar">
  <div class="bot-stat"><span class="lbl">Today</span><span class="val" id="b-today">0</span></div>
  <div class="bot-stat"><span class="lbl">Win%</span><span class="val" id="b-wr">0%</span></div>
  <div class="bot-stat"><span class="lbl">PnL Today</span><span class="val" id="b-pnl">$0.00</span></div>
  <div class="bot-stat"><span class="lbl">Unrealized</span><span class="val" id="b-unreal">$0.00</span></div>
  <div class="bot-stat"><span class="lbl">Open</span><span class="val" id="b-open">0</span></div>
  <div class="ticker"><b>●</b> <span id="ticker-txt">Waiting for signals...</span></div>
</div>

</div><!-- #app -->

<!-- ══ CONFIG MODAL ════════════════════════════════════════════ -->
<div id="cfg-overlay" onclick="if(event.target===this)closeConfig()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;overflow-y:auto;padding:32px 0">
  <div id="cfg-modal" style="width:680px;margin:0 auto;background:var(--bg1);border:1px solid var(--border2);border-radius:6px;overflow:hidden">

    <!-- Modal header -->
    <div style="display:flex;align-items:center;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border)">
      <span style="font-size:13px;font-weight:700;color:#fff;letter-spacing:.5px">⚙ CONFIGURATION</span>
      <span style="margin-left:10px;font-size:10px;color:var(--text3)">Changes apply live + saved to .env</span>
      <button onclick="closeConfig()" style="margin-left:auto;background:transparent;border:none;color:var(--text2);font-size:16px;cursor:pointer;line-height:1">✕</button>
    </div>

    <!-- Section tabs -->
    <div id="cfg-tabs" style="display:flex;border-bottom:1px solid var(--border);background:var(--bg2)"></div>

    <!-- Fields area -->
    <div id="cfg-fields" style="padding:20px;max-height:520px;overflow-y:auto"></div>

    <!-- Footer -->
    <div style="display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--bg2);border-top:1px solid var(--border)">
      <span id="cfg-msg" style="font-size:10px;color:var(--green);flex:1"></span>
      <button onclick="closeConfig()" style="padding:5px 16px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:var(--font);font-size:10px;cursor:pointer">CANCEL</button>
      <button onclick="saveConfig()" style="padding:5px 16px;border-radius:3px;border:none;background:var(--blue);color:#fff;font-family:var(--font);font-size:10px;font-weight:700;cursor:pointer">SAVE &amp; APPLY</button>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let ws = null;
let paused = false;
let activeSymbol = null;
let activeTF = 'M15';
let lwChart = null;
let candleSeries = null;
let slLine = null, tpLine = null, entryLine = null;
let lastData = {};
let alertLog = [];

// ═══════════════════════════════════════════════════════════════
// CLOCK
// ═══════════════════════════════════════════════════════════════
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-GB', {timeZone:'UTC', hour12:false}) + ' UTC';
  // Tick position age displays every second
  document.querySelectorAll('[data-age]').forEach(el => {
    el.textContent = fmtAge(el.dataset.openTime);
  });
}, 1000);

// ═══════════════════════════════════════════════════════════════
// LIGHTWEIGHT CHARTS INIT
// ═══════════════════════════════════════════════════════════════
function initChart() {
  const el = document.getElementById('lwchart');
  const c  = document.getElementById('chart-container');

  lwChart = LightweightCharts.createChart(el, {
    width:  c.clientWidth,
    height: c.clientHeight,
    layout: { background:{color:'#0b0b0f'}, textColor:'#787b86' },
    grid:   { vertLines:{color:'#1f1f2e'}, horzLines:{color:'#1f1f2e'} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor:'#1f1f2e' },
    timeScale: { borderColor:'#1f1f2e', timeVisible:true, secondsVisible:false },
  });

  // Candlestick series
  candleSeries = lwChart.addCandlestickSeries({
    upColor:'#26a69a', downColor:'#ef5350',
    borderUpColor:'#26a69a', borderDownColor:'#ef5350',
    wickUpColor:'#26a69a',   wickDownColor:'#ef5350',
  });

  // Keep chart sized to container
  const ro = new ResizeObserver(() => {
    lwChart.applyOptions({ width: c.clientWidth, height: c.clientHeight });
  });
  ro.observe(c);
}

function drawPriceLines(entry, sl, tp) {
  if (!candleSeries) return;
  [slLine, tpLine, entryLine].forEach(l => { try{ candleSeries.removePriceLine(l) }catch(e){} });
  if (entry) entryLine = candleSeries.createPriceLine({ price:entry, color:'#ffd700', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'Entry' });
  if (sl)    slLine    = candleSeries.createPriceLine({ price:sl,    color:'#ef5350', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'SL' });
  if (tp)    tpLine    = candleSeries.createPriceLine({ price:tp,    color:'#26a69a', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'TP' });
}

async function loadChart(symbol, tf) {
  if (!lwChart) return;
  try {
    const res = await fetch(`/api/ohlcv/${symbol}?tf=${tf}&count=300`);
    if (!res.ok) return;
    const data = await res.json();
    const candles = data.map(d=>({ time:d.time, open:d.open, high:d.high, low:d.low, close:d.close }));
    candleSeries.setData(candles);
    lwChart.timeScale().fitContent();
    document.getElementById('chart-sym').textContent = symbol;

    // Draw price lines for any open position on this symbol
    const pos = (lastData.positions||[]).find(p=>p.symbol===symbol);
    if (pos) drawPriceLines(pos.entry_price, pos.sl_price, pos.tp_price);
    else drawPriceLines(null,null,null);
  } catch(e) { console.warn('Chart load failed:', e); }
}

// ═══════════════════════════════════════════════════════════════
// WEBSOCKET
// ═══════════════════════════════════════════════════════════════
function connectWS() {
  const url = `ws://${location.host}/ws`;
  ws = new WebSocket(url);
  ws.onopen  = () => { setWS(true);  console.log('WS connected'); };
  ws.onclose = () => { setWS(false); setTimeout(connectWS, 3000); };
  ws.onerror = () => { setWS(false); };
  ws.onmessage = e => {
    try { handleData(JSON.parse(e.data)); } catch(err) {}
  };
}
function setWS(on) { document.getElementById('ws-dot').className = 'ws-dot' + (on?' on':''); }

function handleData(d) {
  lastData = d;
  if (d.type === 'full_update') {
    renderTopBar(d.account, d.bot_status);
    renderScanner(d.scanner);
    renderPositions(d.positions);
    renderHistory(d.history);
    renderBottomBar(d.account, d.bot_status, d.positions);
    updateTicker(d.alerts);
    updateChartPrice(d.scanner);
    // Auto-select the highest-scored symbol on first data arrival
    if (!activeSymbol && d.scanner && d.scanner.length > 0) {
      selectSymbol(d.scanner[0].symbol);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// TOP BAR
// ═══════════════════════════════════════════════════════════════
function renderTopBar(acc, status) {
  if (!acc) return;
  setText('t-bal', '$' + fmt2(acc.balance));
  setText('t-eq',  '$' + fmt2(acc.equity));
  setText('t-fm',  '$' + fmt2(acc.free_margin));
  const pnl = acc.profit || 0;
  const pel = document.getElementById('t-pnl');
  pel.textContent = (pnl>=0?'+':'') + '$' + fmt2(pnl);
  pel.className   = 'val ' + (pnl>=0?'p':'n');
  setText('t-pos', status.open_count || 0);
  setText('t-wl',  Object.keys(lastData.scanner||{}).length || 0);
  // Mode badge
  const mb = document.getElementById('mode-badge');
  const mode = status.trading_mode || 'demo';
  mb.textContent = '● ' + mode.toUpperCase();
  mb.className = 'mode-badge ' + mode;
  // Pause button
  paused = status.paused;
  const pb = document.getElementById('btn-pause');
  pb.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
  pb.className   = 'btn-top' + (paused?' paused':'');
}

// ═══════════════════════════════════════════════════════════════
// SCANNER
// ═══════════════════════════════════════════════════════════════
function renderScanner(items) {
  if (!items) return;
  setText('scan-cnt', '(' + items.length + ')');
  setText('t-wl', items.length);
  const list = document.getElementById('scanner-list');
  // Keep existing rows, update in place to avoid scroll jump
  const existing = {};
  list.querySelectorAll('.scan-row').forEach(r => existing[r.dataset.sym] = r);

  const seen = new Set();
  items.forEach(item => {
    seen.add(item.symbol);
    let row = existing[item.symbol];
    if (!row) {
      row = document.createElement('div');
      row.className = 'scan-row';
      row.dataset.sym = item.symbol;
      row.innerHTML = `
        <div class="scan-sym"><span class="sn"></span></div>
        <div class="scan-bar-wrap"><div class="scan-bar"></div></div>
        <div class="scan-arr"></div>`;
      row.addEventListener('click', () => selectSymbol(item.symbol));
      list.appendChild(row);
    }
    const score = item.score || 0;
    const isBO  = item.signal_type === 'BREAKOUT';
    row.querySelector('.sn').textContent = item.symbol;
    const bar = row.querySelector('.scan-bar');
    bar.style.width = score + '%';
    bar.className = 'scan-bar ' + (isBO ? 'bo' : 'pb');
    const arr = row.querySelector('.scan-arr');
    if (item.direction === 'LONG')  { arr.textContent='▲'; arr.className='scan-arr up'; }
    else if (item.direction==='SHORT'){ arr.textContent='▼'; arr.className='scan-arr down'; }
    else { arr.textContent='—'; arr.className='scan-arr flat'; }
    if (item.symbol === activeSymbol) row.classList.add('active');
    else row.classList.remove('active');
  });

  // Remove rows no longer in list
  Object.keys(existing).forEach(sym => {
    if (!seen.has(sym)) existing[sym].remove();
  });
}

function selectSymbol(sym) {
  activeSymbol = sym;
  document.querySelectorAll('.scan-row').forEach(r => {
    r.classList.toggle('active', r.dataset.sym === sym);
  });
  loadChart(sym, activeTF);
}

function updateChartPrice(scanner) {
  if (!activeSymbol || !scanner) return;
  const item = scanner.find(s => s.symbol === activeSymbol);
  if (!item) return;
  document.getElementById('chart-price').textContent = item.price ? item.price.toFixed(5) : '';
}

// ═══════════════════════════════════════════════════════════════
// POSITIONS
// ═══════════════════════════════════════════════════════════════
function renderPositions(positions) {
  const list  = document.getElementById('positions-list');
  const noPos = document.getElementById('no-pos');
  setText('pos-cnt', '(' + positions.length + ')');
  setText('t-pos', positions.length);
  setText('b-open', positions.length);

  if (!positions.length) {
    noPos.style.display = 'flex';
    list.querySelectorAll('.pos-card').forEach(c=>c.remove());
    drawPriceLines(null,null,null);
    return;
  }
  noPos.style.display = 'none';

  const existing = {};
  list.querySelectorAll('.pos-card').forEach(c => existing[c.dataset.ticket] = c);
  const seen = new Set();

  positions.forEach(p => {
    seen.add(String(p.ticket));
    let card = existing[p.ticket];
    const isNew = !card;
    if (isNew) {
      card = document.createElement('div');
      card.className = 'pos-card';
      card.dataset.ticket = p.ticket;
      list.appendChild(card);
    }

    const pnl    = p.pnl_currency || 0;
    const pips   = p.pnl_pips || 0;
    const isPos  = pnl >= 0;
    const dirCls = p.direction === 'LONG' ? 'long' : 'short';
    const entryChg = p.current_price && p.entry_price
      ? ((p.current_price - p.entry_price) / p.entry_price * 100).toFixed(2) : '0.00';
    const slPct = p.sl_price && p.entry_price
      ? ((p.sl_price - p.entry_price) / p.entry_price * 100).toFixed(2) : '0.00';
    const tpPct = p.tp_price && p.entry_price
      ? ((p.tp_price - p.entry_price) / p.entry_price * 100).toFixed(2) : '0.00';

    if (isNew) {
      // Full render only on first appearance
      card.innerHTML = `
        <div class="pos-card-head">
          <span class="pos-sym" onclick="selectSymbol('${p.symbol}')">${p.symbol}</span>
          <span class="dir-badge ${dirCls}">${p.direction}</span>
          <span class="strat-badge">${p.signal_type||'MANUAL'}</span>
          <div class="pos-pnl">
            <div class="pnl-val" data-pnl></div>
            <div class="roe-val" data-roe></div>
          </div>
        </div>
        <div class="pos-grid">
          <div class="pos-fld"><div class="lbl">ENTRY</div><div class="val">${fmtP(p.entry_price)}</div></div>
          <div class="pos-fld">
            <div class="lbl">MARK</div>
            <div class="val" data-mark></div>
            <div class="chg" data-mark-chg></div>
          </div>
          <div class="pos-fld">
            <div class="lbl">SL</div>
            <div class="val r">${fmtP(p.sl_price)}</div>
            <div class="chg n">${slPct}%</div>
          </div>
          <div class="pos-fld">
            <div class="lbl">TP TARGET</div>
            <div class="val g">${fmtP(p.tp_price)}</div>
            <div class="chg p">${tpPct}%</div>
          </div>
          <div class="pos-fld"><div class="lbl">LOT</div><div class="val">${p.lot_size}</div></div>
          <div class="pos-fld"><div class="lbl">OPEN</div><div class="val" data-age data-open-time="${p.open_time}"></div></div>
        </div>
        <button class="btn-close" onclick="closePos(${p.ticket})">✕ CLOSE</button>`;
    }

    // Surgical live updates (run every WS tick, no DOM rebuild)
    const pnlEl = card.querySelector('[data-pnl]');
    const newPnlTxt = (isPos?'+':'') + '$' + fmt2(pnl);
    if (pnlEl && pnlEl.textContent !== newPnlTxt) {
      pnlEl.textContent = newPnlTxt;
      pnlEl.className = 'pnl-val ' + (isPos?'pos':'neg');
      pnlEl.style.transition = 'none';
      pnlEl.style.opacity = '0.4';
      requestAnimationFrame(() => { pnlEl.style.transition='opacity .2s'; pnlEl.style.opacity='1'; });
    }
    const roeEl = card.querySelector('[data-roe]');
    if (roeEl) {
      roeEl.textContent = (isPos?'+':'') + pips.toFixed(1) + 'p';
      roeEl.className = 'roe-val ' + (isPos?'pos':'neg');
    }
    const markEl = card.querySelector('[data-mark]');
    if (markEl) markEl.textContent = fmtP(p.current_price);
    const markChgEl = card.querySelector('[data-mark-chg]');
    if (markChgEl) {
      markChgEl.textContent = (parseFloat(entryChg)>=0?'+':'') + entryChg + '%';
      markChgEl.className = 'chg ' + (parseFloat(entryChg)>=0?'p':'n');
    }

    if (p.symbol === activeSymbol) drawPriceLines(p.entry_price, p.sl_price, p.tp_price);
  });

  Object.keys(existing).forEach(t => { if (!seen.has(t)) existing[t].remove(); });
}

// ═══════════════════════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════════════════════
function renderHistory(history) {
  setText('hist-cnt', '(' + (history||[]).length + ')');
  const tbody = document.getElementById('hist-tbody');
  tbody.innerHTML = '';
  (history||[]).slice().reverse().forEach(t => {
    const isWin   = (t.pnl_currency||0) >= 0;
    const pnlSign = isWin ? '+' : '';
    const pipSign = (t.pnl_pips||0) >= 0 ? '+' : '';
    const dirCls  = t.direction === 'LONG' ? 'long' : 'short';
    const strat   = t.signal_type || 'MANUAL';
    const reason  = t.close_reason || '';
    let reasonCls = 'other';
    if (reason === 'TP HIT')    reasonCls = 'tp';
    else if (reason === 'SL HIT' || reason === 'STOP OUT') reasonCls = 'sl';
    else if (reason === 'MANUAL' || reason === 'BOT')      reasonCls = 'manual';

    const tr = document.createElement('tr');
    tr.className = 'hist-row ' + (isWin ? 'win' : 'loss');
    tr.innerHTML = `
      <td>
        <div class="hist-cell-main">
          <span class="hist-sym">${t.symbol}</span>
          <span class="hist-dir ${dirCls}">${t.direction}</span>
          <span class="hist-strat">${strat}</span>
          ${reason ? `<span class="hist-reason ${reasonCls}">${reason}</span>` : ''}
        </div>
        <div class="hist-cell-sub">
          <span>IN <b>${fmtTime(t.open_time)}</b> @ ${fmtP(t.entry_price)}</span>
          <span>OUT <b>${fmtTime(t.close_time)}</b> @ ${fmtP(t.exit_price)}</span>
          <span>Lot <b>${(t.lot_size||0).toFixed(2)}</b></span>
          <span class="${isWin?'p':'n'}">${pipSign}${(t.pnl_pips||0).toFixed(1)}p</span>
        </div>
      </td>
      <td style="text-align:right;padding:0 10px;white-space:nowrap">
        <div class="hist-pnl ${isWin?'p':'n'}">${pnlSign}$${fmt2(t.pnl_currency||0)}</div>
      </td>`;
    tbody.appendChild(tr);
  });
}

// ═══════════════════════════════════════════════════════════════
// BOTTOM BAR
// ═══════════════════════════════════════════════════════════════
function renderBottomBar(acc, status, positions) {
  setText('b-today', status.trades_today||0);
  const wr = document.getElementById('b-wr');
  wr.textContent = (status.win_rate||0) + '%';
  wr.className   = 'val ' + ((status.win_rate||0)>=50?'p':'n');
  const pnl    = acc ? (acc.profit||0) : 0;
  const pnlEl  = document.getElementById('b-pnl');
  pnlEl.textContent = (pnl>=0?'+':'') + '$' + fmt2(pnl);
  pnlEl.className   = 'val ' + (pnl>=0?'p':'n');
  const unreal = (positions||[]).reduce((s,p) => s+(p.pnl_currency||0), 0);
  const unEl   = document.getElementById('b-unreal');
  unEl.textContent = (unreal>=0?'+':'') + '$' + fmt2(unreal);
  unEl.className   = 'val ' + (unreal>=0?'p':'n');
}

// ═══════════════════════════════════════════════════════════════
// ALERTS TICKER
// ═══════════════════════════════════════════════════════════════
function updateTicker(alerts) {
  if (!alerts || !alerts.length) return;
  const latest = alerts[alerts.length-1];
  const txt = document.getElementById('ticker-txt');
  if (txt.textContent !== latest.message) {
    txt.textContent = `[${latest.time}] ${latest.message}`;
  }
}

// ═══════════════════════════════════════════════════════════════
// UI ACTIONS
// ═══════════════════════════════════════════════════════════════
function showTab(tab) {
  const isChart = tab === 'chart';
  document.getElementById('chart-container').style.display = isChart ? 'block' : 'none';
  document.getElementById('history-panel').style.display   = isChart ? 'none'  : 'block';
  document.getElementById('tab-chart').classList.toggle('active',  isChart);
  document.getElementById('tab-hist').classList.toggle('active',  !isChart);
  if (isChart && lwChart) lwChart.timeScale().fitContent();
}

function setTF(tf) {
  activeTF = tf;
  document.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.replace('m','M').replace('h','H') === tf
      || (b.textContent==='1m'&&tf==='M1') || (b.textContent==='5m'&&tf==='M5')
      || (b.textContent==='15m'&&tf==='M15') || (b.textContent==='1h'&&tf==='H1')
      || (b.textContent==='4h'&&tf==='H4'));
  });
  if (activeSymbol) loadChart(activeSymbol, tf);
}

async function togglePause() {
  const endpoint = paused ? '/api/resume' : '/api/pause';
  await fetch(endpoint, {method:'POST'});
}

async function closePos(ticket) {
  if (!confirm(`Close position #${ticket}?`)) return;
  await fetch(`/api/close/${ticket}`, {method:'POST'});
}

async function closeAll() {
  const positions = lastData.positions || [];
  if (!positions.length) return;
  if (!confirm(`Close all ${positions.length} position(s)?`)) return;
  for (const p of positions) await fetch(`/api/close/${p.ticket}`, {method:'POST'});
}

function manualSignal(dir) {
  if (!activeSymbol) { alert('Select a symbol first from the scanner'); return; }
  console.log(`Manual signal: ${activeSymbol} ${dir}`);
}

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function setText(id, val) { const el=document.getElementById(id); if(el) el.textContent=val; }
function fmt2(n) { return Number(n||0).toFixed(2); }
function fmtP(n) { if(n==null||n===0) return '—'; const s=String(n); return s.length>8?Number(n).toFixed(4):s; }
function fmtTime(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('en-GB',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); }
  catch(e){ return iso.slice(0,16); }
}
function fmtAge(iso) {
  if (!iso) return '—';
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'm';
  return Math.floor(sec/3600) + 'h ' + Math.floor((sec%3600)/60) + 'm';
}

// ═══════════════════════════════════════════════════════════════
// CONFIG MODAL
// ═══════════════════════════════════════════════════════════════
let cfgSchema = null;
let cfgValues = null;
let cfgActiveSection = null;

async function openConfig() {
  document.getElementById('cfg-overlay').style.display = 'block';
  document.getElementById('cfg-msg').textContent = '';
  try {
    const res = await fetch('/api/config');
    const data = await res.json();
    cfgSchema = data.schema;
    cfgValues = data.values;
    buildConfigModal(cfgSchema, cfgValues);
  } catch(e) {
    document.getElementById('cfg-msg').textContent = 'Failed to load config: ' + e.message;
    document.getElementById('cfg-msg').style.color = 'var(--red)';
  }
}

function closeConfig() {
  document.getElementById('cfg-overlay').style.display = 'none';
}

function buildConfigModal(schema, values) {
  const tabsEl   = document.getElementById('cfg-tabs');
  const fieldsEl = document.getElementById('cfg-fields');
  tabsEl.innerHTML = '';
  fieldsEl.innerHTML = '';

  const sections = Object.keys(schema);
  if (!cfgActiveSection || !sections.includes(cfgActiveSection)) cfgActiveSection = sections[0];

  sections.forEach(sectionKey => {
    const sec = schema[sectionKey];
    // Tab button
    const tab = document.createElement('button');
    tab.className = 'cfg-tab' + (sectionKey === cfgActiveSection ? ' active' : '');
    tab.textContent = sec.label.toUpperCase();
    tab.onclick = () => switchCfgSection(sectionKey);
    tabsEl.appendChild(tab);

    // Section div
    const div = document.createElement('div');
    div.id = 'cfg-sec-' + sectionKey;
    div.className = 'cfg-section' + (sectionKey === cfgActiveSection ? ' active' : '');
    div.innerHTML = buildSectionFields(sec.fields, values);
    fieldsEl.appendChild(div);
  });
}

function buildSectionFields(fields, values) {
  let html = '<div class="cfg-grid">';
  for (const [key, meta] of Object.entries(fields)) {
    const val = values[key] ?? '';
    const isFull = meta.type === 'tags';
    html += `<div class="cfg-field${isFull?' full':''}">`;
    html += `<label for="cfg-${key}">${meta.label}</label>`;

    if (meta.type === 'select') {
      html += `<select class="cfg-select" id="cfg-${key}" name="${key}">`;
      (meta.options||[]).forEach(o => {
        html += `<option value="${o}"${o===String(val)?' selected':''}>${o}</option>`;
      });
      html += `</select>`;

    } else if (meta.type === 'bool') {
      const checked = val === true || val === 'True' || val === 'true';
      html += `<div class="cfg-toggle">
        <input type="checkbox" id="cfg-${key}" name="${key}"${checked?' checked':''}>
        <span style="font-size:10px;color:var(--text2)">${checked?'Enabled':'Disabled'}</span>
      </div>`;

    } else if (meta.type === 'tags') {
      html += `<textarea class="cfg-textarea" id="cfg-${key}" name="${key}" rows="5">${val}</textarea>`;
      html += `<span class="cfg-hint">One symbol per line</span>`;

    } else if (meta.type === 'password') {
      html += `<input class="cfg-input" type="password" id="cfg-${key}" name="${key}" value="${val}" autocomplete="new-password">`;

    } else {
      const extras = meta.min!==undefined ? `min="${meta.min}"` : '';
      const extras2 = meta.max!==undefined ? `max="${meta.max}"` : '';
      const extras3 = meta.step!==undefined ? `step="${meta.step}"` : '';
      html += `<input class="cfg-input" type="${meta.type==='number'?'number':'text'}" id="cfg-${key}" name="${key}" value="${val}" ${extras} ${extras2} ${extras3}>`;
    }
    html += `</div>`;
  }
  html += '</div>';
  return html;
}

function switchCfgSection(sectionKey) {
  cfgActiveSection = sectionKey;
  document.querySelectorAll('.cfg-tab').forEach((t,i) => {
    t.classList.toggle('active', Object.keys(cfgSchema)[i] === sectionKey);
  });
  document.querySelectorAll('.cfg-section').forEach(s => {
    s.classList.toggle('active', s.id === 'cfg-sec-' + sectionKey);
  });
}

async function saveConfig() {
  const updates = {};
  if (!cfgSchema) return;
  for (const sec of Object.values(cfgSchema)) {
    for (const [key, meta] of Object.entries(sec.fields)) {
      const el = document.getElementById('cfg-' + key);
      if (!el) continue;
      if (meta.type === 'bool') {
        updates[key] = el.checked;
      } else {
        updates[key] = el.value;
      }
    }
  }
  const msgEl = document.getElementById('cfg-msg');
  msgEl.style.color = 'var(--text2)';
  msgEl.textContent = 'Saving...';
  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(updates),
    });
    const data = await res.json();
    if (res.ok) {
      msgEl.style.color = 'var(--green)';
      msgEl.textContent = '✓ Saved ' + data.updated.length + ' setting(s). Restart bot to apply MT5/server changes.';
      cfgValues = {...cfgValues, ...updates};
    } else {
      throw new Error(data.detail || 'Save failed');
    }
  } catch(e) {
    msgEl.style.color = 'var(--red)';
    msgEl.textContent = '✗ ' + e.message;
  }
}

// Close on Escape
document.addEventListener('keydown', e => { if (e.key==='Escape') closeConfig(); });

initChart();
connectWS();
